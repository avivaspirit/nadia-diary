<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Nadia's Dolls | Nadia's Diary 🎀</title>
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="manifest" href="./manifest.json" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400..700;1,9..144,400..700&family=Caveat:wght@500;600&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="./assets/css/diary.css?v=20260710a" />
  </head>
  <body>
    <header class="site-header">
      <a class="brand" href="./index.html" id="siteTitle">Nadia's Diary 🎀</a>
      <nav aria-label="Main navigation">
        <a href="./index.html">Dianeyy 🐰</a>
        <a aria-current="page" href="./collection.html">Nadia's Dolls 🧸</a>
        <a href="./birthday.html">Happy Birthday 🎂</a>
        <a href="./story.html">Our Story 💑</a>
        <a href="./gallery.html">Gallery 📸</a>
        <a href="./garden.html">Garden 🌿</a>
        <a href="./games.html">Play & Movies 🎮</a>
        <a href="./wish.html">Wish 🌠</a>
        <a href="./closet.html">Closet 👗</a>
        <a href="./travel.html">Travel 🌍</a>
      </nav>
    </header>

    <main>
      <section class="gallery-page">
        <!-- Hero -->
        <div class="gallery-hero reveal">
          <p class="eyebrow" id="dollsEyebrow"></p>
          <h1 id="dollsTitle"></h1>
          <p class="lede" id="dollsIntro"></p>
        </div>

        <!-- Upload bar -->
        <div class="upload-bar reveal">
          <button class="upload-btn" id="addDollBtn" type="button">
            <span class="upload-icon">🧸</span> Add a doll
          </button>
          <button class="upload-btn upload-btn-manage" id="manageToggleBtn" type="button">
            <span class="upload-icon">🗝️</span> <span id="manageLabel">Manage dolls</span>
          </button>
          <span class="upload-hint">pick a frame, name your doll, make it yours ♡</span>
        </div>
        <input type="file" id="dollFileInput" accept="image/*" style="position:absolute;width:0;height:0;opacity:0;overflow:hidden;border:0;" />

        <!-- Category filter + Layout switcher -->
        <div class="gallery-controls reveal">
          <div class="gallery-filters" id="dollFilters">
            <button class="gallery-filter active" data-filter="all">All ♡</button>
            <button class="gallery-filter" data-filter="plushie">Plushies 🧸</button>
            <button class="gallery-filter" data-filter="friend">Friends 👫</button>
            <button class="gallery-filter" data-filter="new">New ✨</button>
          </div>
          <div class="gallery-layouts" id="dollLayouts">
            <button class="layout-btn active" data-layout="scrapbook" title="Scattered scrapbook"><span> Scrapbook</span></button>
            <button class="layout-btn" data-layout="grid" title="Neat grid"><span> Grid</button>
            <button class="layout-btn" data-layout="mosaic" title="Mosaic mix"><span> Mosaic</button>
            <button class="layout-btn" data-layout="postcards" title="Postcard stack"><span> Postcards</button>
          </div>
        </div>

        <!-- Edit panel (slides open) -->
        <div class="upload-panel" id="dollPanel">
          <div class="upload-panel-inner">
            <div class="upload-preview">
              <div class="upload-preview-img" id="dollPreviewImg">
                <img id="dollPreviewPhoto" alt="" />
              </div>
            </div>
            <div class="upload-controls">
              <input type="hidden" id="editingSource" value="" />
              <input type="hidden" id="editingIndex" value="" />
              <div>
                <label>Name</label>
                <input type="text" id="dollNameInput" placeholder="Mimi, Bunny, Lala..." maxlength="30" />
              </div>
              <div>
                <label>Personality tag</label>
                <input type="text" id="dollTagInput" placeholder="sleepy princess" maxlength="40" />
              </div>
              <div>
                <label>Frame style</label>
                <div class="frame-chooser" id="dollFrameChooser">
                  <div class="frame-option fo-clean selected" data-frame="clean" title="Clean"><div class="frame-option-inner">clean</div></div>
                  <div class="frame-option fo-polaroid" data-frame="polaroid" title="Polaroid"><div class="frame-option-inner">polaroid</div></div>
                  <div class="frame-option fo-film" data-frame="film" title="Film"><div class="frame-option-inner">film</div></div>
                  <div class="frame-option fo-white" data-frame="white" title="White"><div class="frame-option-inner">white</div></div>
                  <div class="frame-option fo-tinted" data-frame="tinted" title="Tinted"><div class="frame-option-inner">tinted</div></div>
                </div>
              </div>
              <div>
                <label>Tint color</label>
                <div class="tint-chooser" id="dollTintChooser">
                  <div class="tint-option selected" data-color="#f6c8d6" style="background:#f6c8d6"></div>
                  <div class="tint-option" data-color="#cdeadd" style="background:#cdeadd"></div>
                  <div class="tint-option" data-color="#e8ddf5" style="background:#e8ddf5"></div>
                  <div class="tint-option" data-color="#f7e3c8" style="background:#f7e3c8"></div>
                  <div class="tint-option" data-color="#f3ddb9" style="background:#f3ddb9"></div>
                  <div class="tint-option" data-color="#dde6f0" style="background:#dde6f0"></div>
                </div>
              </div>
              <div>
                <label>Caption</label>
                <input type="text" id="dollCaptionInput" placeholder="a little story about this doll..." maxlength="120" />
              </div>
              <div class="upload-panel-actions">
                <button class="save-photo-btn" id="saveDollBtn" type="button">Add to cabinet ✨</button>
                <button class="cancel-btn" id="cancelDollBtn" type="button">Cancel</button>
              </div>
            </div>
          </div>
        </div>

        <!-- Doll grid -->
        <div class="gallery-grid layout-scrapbook" id="dollGrid"></div>
        <!-- User-added dolls (hidden by default, shown in manage mode) -->
        <div id="userDollsSection" hidden>
          <p class="hand" style="text-align:center;margin:40px 0 12px;font-size:21px;">your added dolls ♡</p>
          <div class="gallery-grid layout-scrapbook" id="userDollGrid"></div>
        </div>
      </section>
    </main>

    <footer id="siteFooter"></footer>

    <script src="./content/site-data.js?v=20260710b"></script>
    <script src="./assets/js/magic.js?v=20260710a"></script>
    <script src="./assets/js/dolls.js?v=20260707n"></script>
  </body>
</html>
