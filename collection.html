<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Nadia's Dolls | Nadia's Diary 🎀</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400..700;1,9..144,400..700&family=Caveat:wght@500;600&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="./assets/css/diary.css" />
  </head>
  <body>
    <header class="site-header">
      <a class="brand" href="./index.html" id="siteTitle">Nadia's Diary 🎀</a>
      <nav aria-label="Main navigation">
        <a href="./index.html">Dianeyy 🐰</a>
        <a aria-current="page" href="./collection.html">Nadia's Dolls 🧸</a>
        <a href="./birthday.html">Happy Birthday 🎂</a>
      </nav>
    </header>

    <main>
      <!-- ========================= cabinet hero =========================== -->
      <section class="cabinet-hero">
        <div>
          <p class="eyebrow" id="dollsEyebrow"></p>
          <h1 id="dollsTitle"></h1>
          <p class="lede" id="dollsIntro"></p>
        </div>
        <div data-parallax="0.05">
          <figure class="washi-frame" style="margin:0;">
            <img id="dollsHeroPhoto" alt="" />
            <figcaption class="washi-caption" id="dollsHeroCaption"></figcaption>
          </figure>
        </div>
      </section>

      <!-- ========================= the cabinet ============================ -->
      <section>
        <div class="section-heading reveal">
          <p class="eyebrow" id="shelfEyebrow"></p>
          <h2 id="shelfTitle"></h2>
        </div>
        <div class="cabinet-shelf">
          <div id="dollGrid" class="doll-grid"></div>
        </div>
      </section>

      <!-- ====================== add / edit drawer ========================= -->
      <section class="drawer-editor" aria-label="Add or edit a doll">
        <button class="drawer-editor-cover" type="button" aria-expanded="false" aria-controls="previewDollForm">
          <span aria-hidden="true">🗝️</span>
          <span>
            <strong>Add a tiny treasure</strong>
            <small>Open this drawer to add a new doll or save an edit.</small>
          </span>
          <span class="drawer-arrow" aria-hidden="true">⌄</span>
        </button>
        <form id="previewDollForm" class="preview-doll-form" hidden>
          <input id="editingIndexInput" type="hidden" value="" />
          <label>
            Doll photo file name
            <input id="dollPhotoPathInput" type="text" placeholder="assets/uploads/photo-name.jpg" />
            <small class="field-help">Use only assets/uploads/photo-name.jpg for live photos.</small>
          </label>
          <label>
            Or choose a preview photo
            <input id="dollPhotoInput" type="file" accept="image/*" />
          </label>
          <div class="field-row">
            <label>
              Name
              <input id="dollNameInput" type="text" placeholder="Mimi, Lala, Bunny..." />
            </label>
            <label>
              Personality tag
              <input id="dollTagInput" type="text" placeholder="sleepy princess" />
            </label>
          </div>
          <div class="field-row">
            <label>
              Main color
              <input id="dollColorInput" type="text" placeholder="pink, cream, blue" />
            </label>
            <label>
              Cute detail
              <input id="dollDetailInput" type="text" placeholder="ribbon, tiny dress, shy smile" />
            </label>
          </div>
          <label>
            Caption
            <textarea id="dollCaptionInput" rows="4" placeholder="Generate one or write your own."></textarea>
          </label>
          <div class="studio-actions">
            <button class="ghost" id="generateCaptionButton" type="button">Generate Caption</button>
            <button class="primary" id="saveDollButton" type="submit">Add Doll</button>
            <button class="ghost" id="cancelEditButton" type="button" hidden>Cancel Edit</button>
          </div>
        </form>
      </section>
    </main>

    <footer id="siteFooter"></footer>

    <script src="./content/site-data.js"></script>
    <script src="./assets/js/magic.js"></script>
    <script src="./assets/js/dolls.js"></script>
  </body>
</html>
