<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Nadia's Diary 🎀</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400..700;1,9..144,400..700&family=Caveat:wght@500;600&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="./assets/css/diary.css" />
  </head>
  <body>
    <header class="site-header">
      <a class="brand" href="./index.html" id="siteTitle">Nadia's Diary 🎀</a>
      <nav aria-label="Main navigation">
        <a aria-current="page" href="./index.html">Dianeyy 🐰</a>
        <a href="./collection.html">Nadia's Dolls 🧸</a>
        <a href="./birthday.html">Happy Birthday 🎂</a>
      </nav>
    </header>

    <main>
      <!-- ============================== hero ============================== -->
      <section class="hero">
        <div class="hero-copy">
          <p class="eyebrow" id="homeEyebrow"></p>
          <h1 id="homeHeadline"></h1>
          <p class="lede" id="homeDescription"></p>
          <div class="hero-actions" id="heroActions"></div>
        </div>
        <div data-parallax="0.05">
          <figure class="washi-frame" id="heroFrame" style="margin:0;">
            <img id="heroPhoto" alt="" />
            <figcaption class="washi-caption" id="heroCaption"></figcaption>
          </figure>
        </div>
      </section>

      <div class="scroll-hint" aria-hidden="true">
        <span>⌄</span>
        her little world
      </div>

      <!-- ============================== bio =============================== -->
      <section class="bio-section">
        <div class="reveal">
          <p class="eyebrow" id="bioEyebrow"></p>
          <h2 id="bioTitle"></h2>
        </div>
        <div class="bio-card reveal reveal-scale">
          <div class="bio-photo-wrap">
            <img id="bioPhoto" alt="" />
            <span class="bio-photo-caption" id="bioPhotoCaption"></span>
          </div>
          <p id="bioText"></p>
        </div>
      </section>

      <!-- =========================== sticky notes ========================= -->
      <section class="notes-section" aria-label="Little Nadia notes">
        <div class="notes-layout">
          <div>
            <div class="reveal">
              <p class="eyebrow" id="notesEyebrow"></p>
              <h2 id="notesTitle"></h2>
            </div>
            <div class="notes-board" id="notesBoard"></div>
          </div>
          <div data-parallax="0.04">
            <figure class="washi-frame reveal reveal-scale" id="notesFeature" style="margin:0;">
              <img id="notesFeaturePhoto" alt="" />
              <figcaption class="washi-caption" id="notesFeatureCaption"></figcaption>
            </figure>
          </div>
        </div>
      </section>

      <!-- ============================ moments ============================= -->
      <section class="moments-section" aria-label="Little moments with Nadia">
        <div class="section-heading reveal">
          <p class="eyebrow" id="momentsEyebrow"></p>
          <h2 id="momentsTitle"></h2>
          <p class="hand" style="font-size:21px;">tap a photo to look closer ✨</p>
        </div>
        <div class="polaroid-wall" id="momentsWall"></div>
      </section>

      <!-- ========================= section cards ========================== -->
      <section class="preview-grid" id="sectionCards" aria-label="Website sections"></section>
    </main>

    <footer id="siteFooter"></footer>

    <script src="./content/site-data.js"></script>
    <script src="./assets/js/magic.js"></script>
    <script src="./assets/js/home.js"></script>
  </body>
</html>
